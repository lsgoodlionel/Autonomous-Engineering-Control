name: control-plane-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      AGENT_HARNESS_CI: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Harden controlled Python
        shell: bash
        run: |
          for path in "${pythonLocation%/*/*}" "${pythonLocation%/*}" "$pythonLocation" "$pythonLocation/bin" "$pythonLocation/bin/python${{ matrix.python }}"; do
            if [[ "$(uname -s)" == "Darwin" ]]; then
              mode=$(stat -f '%Lp' "$path")
            else
              mode=$(stat -c '%a' "$path")
            fi
            if (( (8#$mode & 0022) != 0 )); then
              chmod go-w "$path"
            fi
          done
      - name: Verify controlled Python
        run: scripts/agent-harness --python --version 2>&1 | grep "^Python ${{ matrix.python }}\\."
      - name: Run unit contracts
        run: scripts/agent-harness --python tools/agent-harness/run_tests.py --exclude-substring linux_wrapper --fail-on-skip
      - name: Run deterministic drills
        run: scripts/agent-harness --python tools/agent-harness/drills/run_drills.py
      - name: Scan governed commands
        run: scripts/agent-harness --python tools/agent-harness/drills/run_drills.py --check-forbidden-options
      - name: Check portable host fixture
        run: scripts/agent-harness --python tools/agent-harness/drills/run_drills.py --repo examples/minimal --check-docs

  linux-integration:
    needs: unit
    runs-on: ubuntu-24.04
    env:
      AGENT_HARNESS_CI: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Harden controlled Python
        run: |
          for path in "${pythonLocation%/*/*}" "${pythonLocation%/*}" "$pythonLocation" "$pythonLocation/bin" "$pythonLocation/bin/python3.11"; do
            if [[ "$(uname -s)" == "Darwin" ]]; then
              mode=$(stat -f '%Lp' "$path")
            else
              mode=$(stat -c '%a' "$path")
            fi
            if (( (8#$mode & 0022) != 0 )); then
              chmod go-w "$path"
            fi
          done
      - name: Verify controlled Python
        run: scripts/agent-harness --python --version 2>&1 | grep '^Python 3\.11\.'
      - name: Pull pinned Linux fixture
        run: docker pull python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
      - name: Run Linux wrapper contracts
        run: >-
          scripts/agent-harness --python tools/agent-harness/run_tests.py
          --include-substring linux_wrapper --fail-on-skip --ci
          --linux-image python:3.11-slim@sha256:e88e9763f943ec1834f992a4b51e0f24500486803e8bc534e5767af9ea65f6ce
          --docker /usr/bin/docker

  attest-exact-head:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, linux-integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Build exact-head subject
        shell: bash
        env:
          ATTESTATION_SUBJECT: ${{ runner.temp }}/autonomous-engineering-control.tar
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_REPOSITORY" = "lsgoodlionel/Autonomous-Engineering-Control"
          git archive --format=tar --output "$ATTESTATION_SUBJECT" HEAD
      - name: Sign exact-head subject provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/autonomous-engineering-control.tar
      - name: Verify signed exact-head provenance
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_SUBJECT: ${{ runner.temp }}/autonomous-engineering-control.tar
        shell: bash
        run: >-
          gh attestation verify "$ATTESTATION_SUBJECT"
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/ci.yml"
          --source-digest "$GITHUB_SHA"
          --source-ref "$GITHUB_REF"
